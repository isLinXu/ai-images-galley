services:
  api:
    build: .
    container_name: ai-gallery-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      # 必须显式提供，避免使用代码中的演示默认值
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须在 .env 或环境中设置}
      # 可选：设置后，上传/删除/压缩接口需要 Bearer Token
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - VISION_MODEL=${VISION_MODEL:-gpt-4o}
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-dall-e-3}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-gallery-network

networks:
  ai-gallery-network:
    driver: bridge
